<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>ToDo List</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Введите задачу">
            <button id="addTaskBtn">Добавить</button>
        </div>

        <div class="filter-section">
            <button id="filterAll" class="filter-btn active">Все</button>
            <button id="filterCompleted" class="filter-btn">Выполненные</button>
            <button id="filterUncompleted" class="filter-btn">Невыполненные</button>
            <button id="clearCompleted" class="filter-btn clear-btn">Очистить выполненные</button>
        </div>

        <div class="stats">
            <span id="totalTasks">Всего задач: 0</span>
            <span id="completedTasks">Выполнено: 0</span>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="app.js"></script>
</body>

</html>
